{{ define "main" }}
<div class="container">
    <article class="content gatearwayman-content">
        {{ $content := .Content }}
        {{ $featureMatrixHTML := partial "feature-matrix.html" . }}
        {{ $content = replace $content "<div id=\"feature-matrix-root\"></div>" $featureMatrixHTML }}
        {{ $content | safeHTML }}
    </article>
</div>
{{ end }}

{{ define "scripts" }}
<script src="{{ "/js/yaml-generator.js" | relURL }}"></script>
{{ end }}
